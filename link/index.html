<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quản lý link thiệp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  :root{
    --sky:#b9e2ee;--sky-soft:#e6f4f9;--ink:#1d1d1f;--muted:#5a7783;
    --blue:#1769ab;--blue-2:#2a86c7;--line:#d4e9f1;--card:#fff;--bg:#eef3f4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:32px 16px 80px}
  header{text-align:center;margin-bottom:28px}
  header .script{font-family:'Allura',cursive;font-size:clamp(40px,10vw,60px);color:var(--blue);line-height:1}
  header p{color:var(--muted);font-size:14px;margin-top:6px}

  .panel{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 10px 30px -20px rgba(23,105,171,.5);margin-bottom:20px}
  .panel h2{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input,textarea{width:100%;font:inherit;font-size:16px;padding:11px 13px;border:1px solid #c5dfe9;border-radius:10px;background:#fff;color:var(--ink);outline:none}
  input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,105,171,.12)}
  textarea{min-height:110px;resize:vertical}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}

  .cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 10px 30px -20px rgba(23,105,171,.5);display:flex;flex-direction:column}
  .card .top{background:var(--sky);padding:18px 18px 14px;position:relative}
  .card .tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;background:#fff;color:var(--blue);padding:4px 10px;border-radius:999px}
  .card h3{font-family:'Allura',cursive;font-weight:400;font-size:34px;color:var(--blue);margin-top:8px;line-height:1.1}
  .card .meta{font-size:13px;color:#2d4f60;margin-top:2px}
  .card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
  .url{font-size:13px;background:var(--sky-soft);border-radius:8px;padding:9px 11px;word-break:break-all;color:#21495c;min-height:38px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
  .btn{flex:1;display:inline-flex;justify-content:center;align-items:center;gap:6px;padding:10px 12px;border-radius:999px;font:inherit;font-size:13px;font-weight:500;
    border:1px solid var(--blue);color:var(--blue);background:#fff;cursor:pointer;text-decoration:none;white-space:nowrap;transition:.2s}
  .btn:hover{background:var(--blue);color:#fff}
  .btn.solid{background:var(--blue);color:#fff}
  .btn.solid:hover{background:var(--blue-2)}
  .card.soon{border:2px dashed #c5dfe9;background:transparent;box-shadow:none}
  .card.soon .top{background:transparent}
  .card.soon h3{color:#8fb3c2}
  .card.soon .body{color:var(--muted);font-size:14px}

  .bulk-out{margin-top:14px;display:grid;gap:8px}
  .bulk-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .bulk-item b{font-weight:500;min-width:0;flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bulk-item span{flex:1;min-width:0;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bulk-item button{flex:none;padding:6px 12px}
  .seg{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
  .seg button{padding:7px 14px;border-radius:999px;border:1px solid #c5dfe9;background:#fff;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}

  #toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-80px);background:var(--ink);color:#fff;font-size:14px;padding:10px 18px;border-radius:999px;transition:transform .35s;z-index:9}
  #toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="script">Diệu Hiền &amp; Quốc Anh</div>
    <p>Trang quản lý link thiệp mời</p>
  </header>

  <div class="panel">
    <h2>Tên khách mời</h2>
    <label for="guest">Nhập tên để tạo link riêng (để trống = link chung)</label>
    <input id="guest" placeholder="Ví dụ: Anh Tuấn &amp; gia đình" autocomplete="off">
  </div>

  <div class="cards" id="cards"></div>

  <div class="panel" style="margin-top:20px">
    <h2>Tạo link hàng loạt</h2>
    <label for="bulk">Mỗi dòng một tên khách</label>
    <textarea id="bulk" placeholder="Cô Lan&#10;Anh Tuấn &amp; gia đình&#10;Bạn Minh"></textarea>
    <div class="seg" id="seg" role="group" aria-label="Chọn thiệp"></div>
    <div class="row">
      <button class="btn solid" id="bulkGo">Tạo link</button>
      <button class="btn" id="bulkCopy">Sao chép tất cả</button>
    </div>
    <div class="bulk-out" id="bulkOut"></div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ======== DANH SÁCH THIỆP — thêm/sửa tại đây ======== */
// file = đường dẫn tính từ gốc web ('' = trang gốc, 'ng2/' = thư mục ng2).
// Thêm thiệp: tạo thư mục mới, thêm một dòng bên dưới ("soon: true" = ô chờ, chưa có link)
const INVITES = [
  { file: '',     tag: 'NG1 · Nhà gái 1', title: 'Lễ Vu Quy', meta: 'Chủ Nhật 20.12.2026 · San Antonio, Texas' },
  { file: 'ng2/', tag: 'NG2 · Nhà gái 2', title: 'Lễ Vu Quy', meta: 'Chủ Nhật 03.01.2027 · Tây Ninh' },
  { file: 'nt/',  tag: 'NT · Nhà trai',   title: 'Lễ Vu Quy', meta: 'Chủ Nhật 20.12.2026 · San Antonio, Texas' },
];
/* ==================================================== */

// Trang này nằm ở /link/ → gốc web là thư mục cha
const base = new URL('../', location.href).href;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const linkFor = (inv, name) => base + inv.file + (name ? '?to=' + encodeURIComponent(name) : '');
const live = INVITES.filter(i => !i.soon);

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2000);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast('Đã sao chép link ♥');
}

// Thẻ thiệp
function render() {
  const name = $('guest').value.trim();
  $('cards').innerHTML = INVITES.map((inv, i) => inv.soon ? `
    <div class="card soon">
      <div class="top"><span class="tag">${esc(inv.tag)}</span><h3>${esc(inv.title)}</h3></div>
      <div class="body">Chỗ dành cho thiệp tiếp theo — sẽ cập nhật sau.</div>
    </div>` : `
    <div class="card">
      <div class="top"><span class="tag">${esc(inv.tag)}</span><h3>${esc(inv.title)}</h3><div class="meta">${esc(inv.meta)}</div></div>
      <div class="body">
        <div class="url">${esc(linkFor(inv, name))}</div>
        <div class="row">
          <button class="btn solid" data-copy="${i}">Sao chép</button>
          ${navigator.share ? `<button class="btn" data-share="${i}">Chia sẻ</button>` : ''}
          <a class="btn" href="${esc(linkFor(inv, name))}" target="_blank" rel="noopener">Mở thiệp</a>
        </div>
      </div>
    </div>`).join('');
}
$('cards').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const name = $('guest').value.trim();
  if (b.dataset.copy) copy(linkFor(INVITES[b.dataset.copy], name));
  if (b.dataset.share) {
    const inv = INVITES[b.dataset.share];
    navigator.share({ title: 'Thiệp mời Diệu Hiền & Quốc Anh', url: linkFor(inv, name) }).catch(() => {});
  }
});
$('guest').addEventListener('input', render);
render();

// Tạo hàng loạt
let pick = 0;
function renderSeg() {
  $('seg').innerHTML = live.map((inv, i) => `<button type="button" data-i="${i}" aria-pressed="${i === pick}">${esc(inv.tag)}</button>`).join('');
}
$('seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  pick = +b.dataset.i; renderSeg(); if ($('bulkOut').childElementCount) bulk();
});
renderSeg();

let bulkList = [];
function bulk() {
  const names = $('bulk').value.split('\n').map(s => s.trim()).filter(Boolean);
  bulkList = names.map(n => ({ name: n, url: linkFor(live[pick], n) }));
  $('bulkOut').innerHTML = bulkList.map((x, i) => `
    <div class="bulk-item"><b>${esc(x.name)}</b><span>${esc(x.url)}</span><button class="btn" data-i="${i}">Sao chép</button></div>`).join('');
  if (!names.length) toast('Nhập ít nhất một tên');
}
$('bulkGo').addEventListener('click', bulk);
$('bulkOut').addEventListener('click', e => {
  const b = e.target.closest('button'); if (b) copy(bulkList[b.dataset.i].url);
});
$('bulkCopy').addEventListener('click', () => {
  if (!bulkList.length) bulk();
  if (bulkList.length) copy(bulkList.map(x => `${x.name}: ${x.url}`).join('\n'));
});
try { $('bulk').value = localStorage.getItem('dh-qa-bulk') || ''; } catch (e) {}
$('bulk').addEventListener('input', () => { try { localStorage.setItem('dh-qa-bulk', $('bulk').value); } catch (e) {} });
</script>
</body>
</html>
